# LLaMEA Benchmark Configuration
# =============================
# Configuration file for running LLaMEA benchmarks with different settings

# Default configuration
default:
  llm_provider: "dummy"
  experiment_name: "default_benchmark"
  budget: 50
  n_parents: 5
  n_offspring: 5
  elitism: true
  hpo: false
  evaluation_strategy: "simple"
  verbose: true

# Quick test configuration (for debugging)
quick_test:
  llm_provider: "dummy"
  experiment_name: "quick_test"
  budget: 5
  n_parents: 2
  n_offspring: 2
  elitism: true
  hpo: false
  evaluation_strategy: "simple"
  verbose: true

# OpenAI GPT-4 configuration
openai_gpt4:
  llm_provider: "openai"
  llm_model: "gpt-4-turbo"
  experiment_name: "openai_gpt4_benchmark"
  budget: 100
  n_parents: 5
  n_offspring: 5
  elitism: true
  hpo: false
  evaluation_strategy: "bbob"
  verbose: true

# Gemini configuration
gemini:
  llm_provider: "gemini"
  llm_model: "gemini-2.0-flash"
  experiment_name: "gemini_benchmark"
  budget: 100
  n_parents: 5
  n_offspring: 5
  elitism: true
  hpo: false
  evaluation_strategy: "bbob"
  verbose: true

# Large scale benchmark
large_scale:
  llm_provider: "openai"
  llm_model: "gpt-4-turbo"
  experiment_name: "large_scale_benchmark"
  budget: 200
  n_parents: 10
  n_offspring: 10
  elitism: true
  hpo: true
  evaluation_strategy: "bbob"
  verbose: true

# Hyperparameter optimization focused
hpo_focused:
  llm_provider: "openai"
  llm_model: "gpt-4-turbo"
  experiment_name: "hpo_benchmark"
  budget: 50
  n_parents: 3
  n_offspring: 3
  elitism: true
  hpo: true
  evaluation_strategy: "simple"
  verbose: true

# No elitism configuration (comma strategy)
no_elitism:
  llm_provider: "dummy"
  experiment_name: "no_elitism_test"
  budget: 30
  n_parents: 5
  n_offspring: 5
  elitism: false
  hpo: false
  evaluation_strategy: "simple"
  verbose: true
